pplication-details/58726", "lon": -6.451988007507119, "lat": 53.318259713966846, "description": "Permission for a period of ten years for development at this site of 16.5 hectares that is located within lands in the Grange Castle South Business Park and includes the residential property of Ballybane, Old Nangor Road on land within the townlands of Milltown; Ballybane and; Aungierstown and Ballybane; and bounding Baldonnel Road to the west; both the Old and New Nangor Road to the north; and Grange Castle South Access Road to the South, Baldonnel, Dublin 22. The development will consist of the following: (1) The demolition of the existing two storey dwelling of Ballybane and associated farm buildings (565sq.m) and the construction of 3 two storey data centres with mezzanine floors at each level of each facility and associated ancillary development that will have a gross floor area of 80,269sq.m on an overall site of 16.5hectares. (2) 1 two storey data centre (Building A) that will be located to the south-west of the site and will have a gross floor area of 28,573sq.m. and will include 26 emergency generators located at ground floor level within a compound to the northern side of the data centre with associated flues that will be 25m in height. The facility will also include 26 ventilation shafts which will be located above the northern end of each emergency generator that will measure 20m in height. (3) 1 two storey data centre (Building B) which will be located to the north-west of the site, and to the immediate north of Building A and will have a gross floor area of 21,725sq.m and which will include 18 emergency generators located at ground floor level within a compound to the northern side of the data centre with associated flues that will be 25m in height. The facility will also include 18 ventilation shafts which will be located above the southern end of each emergency generator that will measure 20m in height. (4) 1 two storey data centre (Building C) which will be constructed last, will be located to the eastern part of the site on a north-south axis and will have a gross floor area of 28,573sq.m. It will include 26 emergency generators located at ground floor level within a compound to the western side of the data centre with associated flues that will be 25m in height. The facility will also include 26 ventilation shafts that will be located above the western end of each emergency generator that will measure 20m in height. (5) Each of the three data centres will include data storage rooms, associated electrical and mechanical plant rooms, loading bays, maintenance and storage spaces, office administration areas, and plant including PV panels at roof level as well as a separate house generator for each facility which will provide emergency power to the admin and ancillary spaces. Each data centre will also include a diesel tank and a refuelling area to serve the proposed emergency generators. (6) The overall height of each data centre apart from the flues and plant at roof level is c. 19.85m above the finished floor level. (7) 1 temporary and single storey substation (29sq.m). (8) 3 single storey MV buildings (each 249sq.m - 747sq.m in total) which manage the supply of electricity from the substations to each data centre and are located to the immediate west of the generator compound within buildings A and B, and to the south of the generator compound withing building C. (9) 8 prefabricated containerised electrical rooms (65sq.m each and 520sq.m overall) that are stacked in pairs to the immediate south of the temporary substation. (10) Ancillary site development works, which will include attenuation ponds and the installation and connection to the underground foul and storm water drainage network and installation of utility ducts and cables which will include the drilling and laying of ducts and cables under Baldonnel stream. Other ancillary site development works will include hard and soft landscaping, lighting, fencing ructed under Reg. Ref.: 2229/19 as amended by Reg. Ref.:3200/20. -Construction of access arrangements and internal road network and circulation areas, footpaths, provision of car parking (58 no. spaces) and bicycle parking (24 no. spaces); and -Hard and soft landscaping and planting, lighting, boundary treatments, and all associated and ancillary works including underground foul and storm water drainage network, and utility cables.", "description_html": "Permission for development on a site at Clonshaugh Business and Technology Park, Dublin 17. The subject site (with an area of c. 3.75 ha) comprises the site of former Units 15 and 16 (previously demolished) and the former Ricoh Building. The site is located to the north of the Santry River and the R104 Oscar Traynor Road, to the west of Clonshaugh Road, and to the south and east of existing estate roads. The proposed development, for which a seven-year permission is sought, comprises the following: -Demolition of the existing former Ricoh building, and all other associated site clearance works including removal of existing site services and ESB pillar boxes (other buildings previously occupying the site were demolished under Reg. Ref: 2229/19, a previously permitted data centre development, as amended by Reg.Ref:3200/20); -Construction of two data centre buildings (Data Centre A and Data Centre B), with a gross floor area (GFA) of c. 12,875 sq.m and c. 1,455 sq.m respectively, each over two storeys (with Data Centre A also including two mezzanine levels), with plant at roof level; -Data Centre A will be located in the northern portion of the site, with a parapet height of c.19.8 metres and will accommodate data halls, associated electrical and mechanical plant rooms, a loading bay, maintenance and storage space, office administration areas, with plant and solar panels at roof l"}, {"case_key": "kildare_county_council_19164", "planning_authority": "Kildare County Council", "application_number": "19164", "decision": " ng application is 13,590sqm/1.359 Hectares,", "description_html": "the construction of 1 No. building described as follows: The building is c.5474sqm with an additional c.2826sqm in external plant area and is made up of three distinct parts. The central two storey block has a mono-pitch roof structure, the ridge height of which is c.15.15m and it accommodates the data halls and associated plant and equipment rooms. The front block has a flat roof structure with a parapet and is two storey with a parapet height of c.10.60m and it accommodates the entrance reception, offices, meeting room, associated support areas, tea station, w.c.\u2019s, stores, plant areas including 5 No. backup generators and 2 No. substations (3MV). The third block is located to the rear of the main data hall block and consists mainly of an external two storey plant space with external stairways with intermediate level gangways. The two storey external plant area is screened (c.10.6m) by a metal mesh structure. There are also two, two-storey flat roof internal plant rooms connecting to the central block. The provision of a perimeter service road/green road around the building to allow for access and maintenance of equipment to the front and rear of the block. The provision of a perimeter fence and access gates, hard and soft landscaping, signage and all associated site works. The area of the site relating to this planning application is 13,590sqm/1.359 Hectares,"}, {"case_key": "kildare_county_council_2360047", "planning_authority": "Kildare County Council", "application_number": "2360047", "decision": "CONDITIONAL", "decision_bucket": "granted", "received_date": "2023-07-18 00:00:00+00:00", "age_years": 2.7405886379192332, "age_bucket": "mid", "source_category": "likely_data_centre", "source_reason": "description explicitly describes a data-centre, data-storage, or data-centre-style ICT facility project", "review_note": "", "development_address": "Kildare Innovation Campus (KIC)  , Barnhall Mea  no. flues 33 metres in height will be accommodated along with south-western elevation of the building. \u2022Energy Centre 2 will comprise a GFA of 9,180 sq.m. within a single storey building and will accommodate 18 no. generators. 6 no. flues 33 metres in height will be accommodated along the south-western elevation of the building. \u2022Construction of a battery compound to provide electricity storage and backup power, located to the northeast of Energy Centre 2, to comprise 27 no. battery arrays within a compound area of c. 0.7 hectares. A single storey MV switch-room building (c. 181 sq.m. GFA) will be provided to the west of the battery compound. \u2022Provision of a transformer compound (to the northwest of Energy Centre 1), along with a welfare building (c.38 sq.m. GFA).\u2022Provision of fuel storage tanks (2 no.) within a bunded compound to the north of Energy Centre 2.\u2022Construction of a new access from the existing estate access road to the north of the site, internal road network and circulation areas, footpaths, provision of 6 no. car parking spaces and 4 no. cycle parking spaces. \u2022Landscaping and planting, boundary treatments, lighting, security fencing and all associated ancillary and site works including underground foul and storm water drainage network (including on-site wastewater treatment system) and utility cables", "description_html": "Full ten-year planning permission for development on this site located at Avoca River Park, Arklow, Co. Wicklow. The proposed development is to be located within the townlands of Shelton Abbey and Marsh. The site is bound to the west by the site of a permitted data storage facility development (permitted under Reg. Ref.: 201285), to the north by the access road to Avoca River Park, to the south by undeveloped lands and to the east by undeveloped lands beyond which is the M11 motorway. The proposed development consists of the following: \u2022All site clearance and enabling works required to facilitate
