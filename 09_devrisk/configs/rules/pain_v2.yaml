# pain_v2 composite (2026-09-27): adds economic timing/price components.
# Extends pain_v1 (planning friction + activation + completion) with observed
# exit/price outcomes from PPR links. Unknown components are treated as absent
# in the composite; coverage is reported separately. No cost-overrun claims.

schema_version: 1

pain_v2:
  description: >-
    Severe observable development pain for a granted 10+ unit residential
    scheme measured by 36 months after final grant: appeals, very slow
    planning decisions, slow activation, slow completion, slow exit where
    sales are observed, and below-market pricing (margin-pressure indicator).
    Positive-definite: only observed severe components mark a scheme high;
    unlinked events are unknown, never pain.
  components:
    appeal_submitted:
      label: applicant appeal observed (register AppealSubmittedDate/AppealRefNumber)
    fi_requested:
      label: formal FI request observed (register FIRequestDate/FIRecDate)
    planning_duration_days:
      label: days from received to decision
    slow_planning_12m:
      label: planning_duration_days >= 365
    slow_planning_24m:
      label: planning_duration_days >= 730
    activation_days:
      label: days from final grant to first confirmed commencement
    slow_activation_24m:
      label: activation_days >= 730
    completion_days:
      label: days from first confirmed commencement to completion certificate
    slow_completion_36m:
      label: completion_days >= 1095
    no_completion_matured:
      label: confirmed commencement >= 36 months before censor, no completion record
    slow_exit_24m:
      label: first confirmed PPR sale >= 24 months after commencement (sold schemes only; unsold schemes unknown)
    below_market_25pct:
      label: scheme median PPR price below 25th percentile of same-county contemporaneous transactions
  severity:
    high_if_any:
      - appeal_submitted
      - slow_planning_24m
      - slow_activation_24m
      - slow_completion_36m
      - slow_exit_24m
    moderate_if_any:
      - fi_requested
      - slow_planning_12m
      - no_completion_matured
      - below_market_25pct
    low_if_none_of_above: true
  targets:
    pain_high_binary: "level == high"
    pain_level: "high | moderate | low"
  notes:
    - "slow_exit only defined for schemes with confirmed PPR links; unsold/unlinked is UNKNOWN (linkage failure is not evidence of slow sales)."
    - "below_market_25pct is a margin-pressure indicator, not a cost-overrun claim."
    - "PPR reuse: acknowledge PSRA source; not for the principal purpose of advertising a product."
